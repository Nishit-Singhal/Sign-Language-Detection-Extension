<!DOCTYPE html>
<html>
<head>
  <title>Sign Language Detection</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
    }
    video {
      width: 100%;
      max-width: 320px;
      border-radius: 8px;
    }
    #status {
      margin-top: 10px;
      padding: 8px;
      background: #333;
      border-radius: 4px;
      font-size: 14px;
    }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <div id="status">Initializing...</div>
  <script type="module" src="camera.js"></script>
</body>
</html>
